apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawl4ai
  labels:
    app: crawl4ai
    app.kubernetes.io/component: scraper
    app.kubernetes.io/part-of: aigenzey-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawl4ai
  template:
    metadata:
      labels:
        app: crawl4ai
    spec:
      containers:
      - name: crawl4ai
        image: unclecode/crawl4ai:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 11235
          name: http
        env:
        - name: CRAWL4AI_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: are-secret
              key: CRAWL4AI_API_TOKEN
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
